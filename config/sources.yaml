    name: Europa Press
    domains: [europapress.es]
    group: europapress
    lean: agencia
    kind: agencia
    scope: nacional
    enabled: true
    feeds:
      - {url: "https://www.europapress.es/rss/rss.aspx", area: null, frontpage: true}
      - {url: "https://www.europapress.es/rss/rss.aspx?ch=00140", area: null, frontpage: true}
      - {url: "https://www.europapress.es/rss/rss.aspx?ch=00066", area: politica}
      - {url: "https://www.europapress.es/rss/rss.aspx?ch=00136", area: economia}
      - {url: "https://www.europapress.es/rss/rss.aspx?ch=00069", area: internacional}
      - {url: "https://www.europapress.es/rss/rss.aspx?ch=00073", area: sociedad}
      - {url: "https://www.europapress.es/rss/rss.aspx?ch=00068", area: justicia}
      - {url: "https://www.europapress.es/rss/rss.aspx?ch=00072", area: ciencia-tecnologia}
      - {url: "https://www.europapress.es/rss/rss.aspx?ch=00071", area: cultura-deportes}
      - {url: "https://www.europapress.es/rss/rss.aspx?ch=00067", area: cultura-deportes}

