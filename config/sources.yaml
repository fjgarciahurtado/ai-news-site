# Allowlist of outlets. Only items whose URL belongs to an enabled outlet below are used.
#
# STATUS: approved by the user on 2026-10-17. Feeds were probed on 2026-10-17.
#
# Fields:
#   id        stable identifier, used in data/ and article frontmatter
#   name      display name
#   domains   URL domains attributed to this outlet (longest match wins)
#   group     ownership group; outlets in the same group do not count as independent
#   lean      used ONLY for the source-balance check:
#             izquierda | centro-izquierda | centro | centro-derecha | derecha | publico | agencia
#   kind      agencia | diario | radio | tv | economico
#   scope     nacional | regional (regional outlets are disabled until the scope is decided)
#   enabled   false keeps the entry documented without fetching it
#   feeds     url, area (see categories.yaml; null for front pages), frontpage (true for home feeds)

outlets:
