convocatoria:
  texto: >-
    El Real Decreto 806/2026, de 5 de octubre, disuelve el Congreso y el Senado elegidos el 23 de
    julio de 2023 y convoca elecciones a ambas Cámaras para el domingo 29 de noviembre de 2026. La
    campaña va del viernes 13 al viernes 27 de noviembre y las nuevas Cámaras se constituyen el 23
    de diciembre.
  fuentes: [boe-2026-20742]

# Rule approved by the editor on 2026-11-16. Nationalist and regional parties appear only on the
# pactos page.
criterio:
  texto: >-
    Tienen ficha propia los partidos y coaliciones que presentan candidatura al Congreso en la
    mayoría de las 52 circunscripciones y que obtuvieron al menos el 1 % de los votos válidos en
    toda España en las elecciones generales de 2023 o en las europeas de 2024, solos o como
    principal integrante de una coalición. Los partidos nacionalistas y regionalistas aparecen en la
    página de pactos.
  fuentes: [boe-2026-23103, boe-2023-18907, boe-2024-13092]

# Valid votes nationwide, the base of every percentage on the site.
validos:
  generales_2023: {votos: 24688087, fuentes: [boe-2023-18907]}
  europeas_2024: {votos: 17527438, fuentes: [boe-2024-13092]}

# Parties below the 1 % line that present candidates in many constituencies: listed, no page.
otros_nacionales:
  - texto: Frente Obrero (FO). Candidatura al Congreso en 51 circunscripciones; 0,38 % en las europeas de 2024 (66.039 votos).
    fuentes: [boe-2026-23103, boe-2024-13092]
  - texto: Partido Comunista de los Trabajadores de España (PCTE). Candidatura al Congreso en 45 circunscripciones, con distintos nombres territoriales.
    fuentes: [boe-2026-23103]
  - texto: Partido Animalista con el Medio Ambiente (PACMA). Candidatura al Congreso en 37 circunscripciones; 0,77 % en las europeas de 2024 (135.691 votos).
    fuentes: [boe-2026-23103, boe-2024-13092]
  - texto: Por un Mundo Más Justo (MUNDO+JUSTO). Candidatura al Congreso en 28 circunscripciones.
    fuentes: [boe-2026-23103]
