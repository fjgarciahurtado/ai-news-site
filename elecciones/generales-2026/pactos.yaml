# Página de pactos (/eleccionesgenerales2026/pactos/). Schema and rules: CLAUDE.md, section
# "Elecciones generales 2026". Every statement has `fuentes` (ids from eleccion.yaml `documentos`,
# ids from this file's `documentos`, or inline {titulo, url, fecha}). Past facts only: no polls,
# no projections of who could add up to a majority.

